<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111118;
      color: #e2e8f0;
      border: 1px solid rgba(129,140,248,0.22);
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR: drag handle + title + action buttons ── */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px 4px 12px;
      background: #0d0d14;
      border-bottom: 1px solid rgba(255,255,255,.05);
      -webkit-app-region: drag;   /* entire row is draggable */
      flex-shrink: 0;
    }
    .drag-grip {
      display: flex; gap: 2px; align-items: center; flex-shrink: 0;
    }
    .drag-grip span {
      display: block; width: 2px; height: 12px;
      background: rgba(255,255,255,.15); border-radius: 2px;
    }
    .top-title {
      flex: 1; min-width: 0;
      font-size: 11px; font-weight: 600;
      color: #94a3b8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Action buttons must opt-out of drag */
    .top-actions {
      display: flex; gap: 2px; flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .top-btn {
      background: none; border: none; cursor: pointer;
      color: #475569; font-size: 11px;
      width: 22px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, background .15s;
    }
    .top-btn:hover { color: #e2e8f0; background: rgba(255,255,255,.08); }
    .top-btn.close:hover { color: #f87171; background: rgba(239,68,68,.15); }

    /* ── BOTTOM: content + controls ── */
    .bottom {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 8px 12px;
      flex: 1;
    }

    /* Cover emoji */
    .cover {
      width: 44px; height: 44px; border-radius: 8px;
      background: linear-gradient(135deg,#1e1e3f,#2d2d5f);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      overflow: hidden;
      position: relative;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* Meta text */
    .meta { flex: 1; min-width: 0; }
    .meta-title {
      font-size: 11.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #e2e8f0;
    }
    .meta-chapter {
      font-size: 10px; color: #7c8ba0; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .progress-track {
      height: 3px; background: #1e1e3f; border-radius: 2px; margin-top: 6px;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg,#6366f1,#818cf8);
      border-radius: 2px; transition: width .6s linear;
    }

    /* Playback controls */
    .controls {
      display: flex; align-items: center; gap: 2px; flex-shrink: 0;
    }
    .ctrl-btn {
      width: 28px; height: 28px; border: none; background: transparent;
      color: #7c8ba0; cursor: pointer; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }
    .ctrl-btn.play {
      background: #4f46e5; color: #fff;
      width: 34px; height: 34px;
      box-shadow: 0 0 10px rgba(99,102,241,.35);
    }
    .ctrl-btn.play:hover { background: #6366f1; }
  </style>
</head>
<body>

  <!-- Draggable top bar -->
  <div class="top-bar">
    <div class="drag-grip">
      <span></span><span></span><span></span>
    </div>
    <div class="top-title" id="topTitle">Sonara</div>
    <div class="top-actions">
      <button class="top-btn" id="openBtn" title="Open Sonara">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polyline points="15 3 21 3 21 9"/>
          <path d="M10 14 21 3"/>
          <path d="M21 13v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/>
        </svg>
      </button>
      <button class="top-btn close" id="closeBtn" title="Close mini player">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Content + controls -->
  <div class="bottom">
    <div class="cover" id="coverEl">🎧<img id="coverImg" alt="" /></div>
    <div class="meta">
      <div class="meta-title" id="titleEl">No book playing</div>
      <div class="meta-chapter" id="chapterEl">Open a book in Sonara</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="Previous">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"/>
          <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"/>
        </svg>
      </button>
      <button class="ctrl-btn play" id="playBtn" title="Play / Pause">
        <svg id="playIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    document.getElementById('prevBtn').onclick  = () => ipcRenderer.send('mini:prev');
    document.getElementById('nextBtn').onclick  = () => ipcRenderer.send('mini:next');
    document.getElementById('playBtn').onclick  = () => ipcRenderer.send('mini:play');
    document.getElementById('closeBtn').onclick = () => ipcRenderer.send('mini:close');
    document.getElementById('openBtn').onclick  = () => ipcRenderer.send('mini:open');

    const PAUSE_SVG = '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';
    const PLAY_SVG  = '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>';

    function _toCoverUrl(coverPath) {
      if (!coverPath || typeof coverPath !== 'string') return '';
      if (/^(data:|https?:|file:\/\/)/i.test(coverPath)) return coverPath;
      return 'file:///' + coverPath.replace(/\\/g, '/');
    }

    function _renderCover(coverPath) {
      const coverEl = document.getElementById('coverEl');
      const coverImg = document.getElementById('coverImg');
      if (!coverEl || !coverImg) return;

      const src = _toCoverUrl(coverPath);
      if (src) {
        coverImg.src = src;
        coverImg.style.display = 'block';
        coverEl.firstChild.textContent = '';
      } else {
        coverImg.removeAttribute('src');
        coverImg.style.display = 'none';
        coverEl.firstChild.textContent = '🎧';
      }
    }

    ipcRenderer.on('player:state', (_, state) => {
      const title = state.title || 'No book playing';
      document.getElementById('topTitle').textContent   = title;
      document.getElementById('titleEl').textContent    = title;
      document.getElementById('chapterEl').textContent  = state.chapterTitle || (state.title ? '' : 'Open a book in Sonara');
      document.getElementById('progressFill').style.width = (state.percent || 0) + '%';
      document.getElementById('playIcon').innerHTML     = state.isPlaying ? PAUSE_SVG : PLAY_SVG;
      _renderCover(state.coverPath || '');
    });
  </script>
</body>
</html>
